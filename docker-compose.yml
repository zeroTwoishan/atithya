services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: atithya
      POSTGRES_USER: atithya
      POSTGRES_PASSWORD: atithya
    ports:
      - "5432:5432"
    volumes:
      - atithya_pgdata:/var/lib/postgresql/data

volumes:
  atithya_pgdata:
