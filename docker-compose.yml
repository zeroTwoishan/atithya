services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhraman
      POSTGRES_USER: bhraman
      POSTGRES_PASSWORD: bhraman
    ports:
      - "5432:5432"
    volumes:
      - bhraman_pgdata:/var/lib/postgresql/data

volumes:
  bhraman_pgdata:
